name: Publish

# Every push to main publishes a new version to npm.
# The version is the next patch after what npm has, unless package.json
# already says something higher (bump it there for a minor or major release).
# Needs an npm granular token that can publish nusacode, saved as the repo secret NPM_TOKEN.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm record where the package was built (provenance)

# One publish at a time, so two quick pushes never pick the same version.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Pick the next version
        run: |
          repo=$(node -p "require('./package.json').version")
          live=$(npm view nusacode version 2>/dev/null || echo 0.0.0)
          next=$(node -e '
            const [r, l] = process.argv.slice(1).map(v => v.split(".").map(Number));
            const higher = r[0] - l[0] || r[1] - l[1] || r[2] - l[2];
            console.log(higher > 0 ? r.join(".") : [l[0], l[1], l[2] + 1].join("."));
          ' "$repo" "$live")
          echo "npm has $live, package.json has $repo, publishing $next"
          npm version "$next" --no-git-tag-version --allow-same-version
      # prepublishOnly runs the tests, prepack builds vendor/pi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
